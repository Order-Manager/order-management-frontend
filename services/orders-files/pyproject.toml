[project]
name = "orders-files"
version = "0.1.0"
description = "Invoice PDFs for IFT Orders: upload, download and delete, staff only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "google-auth>=2.30",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
